name: check-docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
        bundler:
          - vite
          - webpack

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build docs with ${{ matrix.bundler }}
        run: pnpm docs:build
        env:
          DOCS_BUNDLER: ${{ matrix.bundler }}

  check-docs-result:
    if: ${{ always() }}
    name: check-docs result
    runs-on: ubuntu-latest
    needs:
      - check-docs
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
